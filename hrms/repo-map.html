oyed on cPanel / Hostinger. Live at join.rcsfacility.com. The repo mixes legacy PHP HRMS with modern React ESS.",tags:["monorepo","production"],children:[{id:"github",name:".github",path:".github/",type:"folder",desc:"CI/CD workflows",detail:"GitHub Actions automation. Currently only sitemap generation, but extensible for CI.",tags:["ci"],children:[{id:"workflows",name:"workflows",path:".github/workflows/",type:"folder",desc:"Workflow definitions",detail:"Contains automation YAMLs. Triggered on push to main.",children:[{id:"sitemap-yml",name:"sitemap.yml",path:".github/workflows/sitemap.yml",type:"file",desc:"Auto-generates sitemap.xml on push",detail:"Runs on push to main. Crawls public routes from RCS_ESS and static PHP pages, generates sitemap.xml for SEO. Prevents stale sitemap. Uses Node action + custom script.",tags:["auto","seo"]}]}]},{id:"rcs-ess",name:"RCS_ESS",path:"RCS_ESS/",type:"folder",desc:"ESS SPA - React + Vite + TS + Tailwind 4",detail:"Employee Self Service SPA. Mobile-first PWA. Vite + React 18 + TypeScript + Tailwind CSS v4. Role-aware routing. All API calls go via lib/ess-api.ts which attaches X-API-KEY and handles JWT refresh.",tags:["react","spa","mobile"],children:[{id:"rcs-src",name:"src",path:"RCS_ESS/src/",type:"folder",desc:"Application source",detail:"Core app code. Entry is main.tsx -> App.tsx with BrowserRouter.",children:[{id:"app-tsx",name:"App.tsx",path:"RCS_ESS/src/App.tsx",type:"file",desc:"Root router + role guard + layout",detail:"Defines all ESS routes: /dashboard, /attendance, /leaves, /expenses, /tasks, /payslip, /manpower, /unit-visits, /team, /helpdesk, /profile. Implements ProtectedRoute wrapper that checks JWT from ess-auth.ts and role hierarchy. Suspense + lazy loading for code split.",tags:["router","auth"]},{id:"lib",name:"lib",path:"RCS_ESS/src/lib/",type:"folder",desc:"API & Auth utilities",detail:"Abstraction layer over raw fetch.",children:[{id:"ess-api",name:"ess-api.ts",path:"RCS_ESS/src/lib/ess-api.ts",type:"file",desc:"Typed fetch wrapper - X-API-KEY + JWT + refresh queue",detail:"Central API client. Attaches X-API-KEY from env, Authorization: Bearer <JWT> from memory. Intercepts 401 -> calls /api/ess/refresh.php using HttpOnly cookie to get new JWT. Queues concurrent requests during refresh to avoid race. All endpoints return {success, data, message}.",tags:["critical","api"]},{id:"ess-auth",name:"ess-auth.ts",path:"RCS_ESS/src/lib/ess-auth.ts",type:"file",desc:"JWT memory store + role helpers",detail:"Stores JWT in memory (not localStorage) for XSS safety. Refresh token lives in HttpOnly cookie. Provides useAuth() hook, hasRole(), isSupervisorUp(). Decodes JWT payload to get emp_id, role, unit_id. Logout clears memory + calls /logout to invalidate cookie.",tags:["jwt","security"]}]},{id:"components",name:"components",path:"RCS_ESS/src/components/",type:"folder",desc:"UI Components",detail:"Feature-colocated components.",children:[{id:"ess-comp",name:"ess",path:"RCS_ESS/src/components/ess/",type:"folder",desc:"ESS feature pages (14 modules)",detail:"Each file is a full page with data fetching, mutations, optimistic UI.",children:[{id:"dash",name:"Dashboard.tsx",path:"RCS_ESS/src/components/ess/Dashboard.tsx",type:"file",desc:"Role-based dashboard - widgets vary",detail:"Shows attendance punch CTA, team count for managers, pending approvals, upcoming leaves, expense summary. Fetches /team-summary.php for supervisors. Supervisor sees manpower gaps, manager sees region KPIs."},{id:"att",name:"Attendance.tsx",path:"RCS_ESS/src/components/ess/Attendance.tsx",type:"file",desc:"Punch IN/OUT + GPS + selfie",detail:"Uses Geolocation API + camera capture. Sends lat/lng + base64 selfie to /attendance.php. Validates within unit geofence (server-side). Shows history calendar. Handles night shift cutoff logic."},{id:"leaves",name:"Leaves.tsx",path:"RCS_ESS/src/components/ess/Leaves.tsx",type:"file",desc:"Leave apply + balance + approval",detail:"Form with leave type (CL/SL/EL). Checks balance from ess_employee_cache. Approval flow: supervisor -> manager -> admin. Shows status timeline."},{id:"expenses",name:"Expenses.tsx",path:"RCS_ESS/src/components/ess/Expenses.tsx",type:"file",desc:"Expense claims + receipts",detail:"Upload bills, amount, category. Routes to /expenses.php. Manager approval. Reimbursed flag syncs to payroll module."},{id:"tasks",name:"Tasks.tsx",path:"RCS_ESS/src/components/ess/Tasks.tsx",type:"file",desc:"Task assignment & tracking",detail:"Managers assign tasks to team. Real-time status: pending > in_progress > done. Linked to unit-visits for field staff."},{id:"payslip",name:"Payslip.tsx",path:"RCS_ESS/src/components/ess/Payslip.tsx",type:"file",desc:"View/download payslip PDF",detail:"Fetches payroll from payroll table via /payslip.php. Generates PDF client-side using payroll breakdown. Sensitive - requires PIN re-auth for full view."},{id:"manpower",name:"ManpowerStatus.tsx",path:"RCS_ESS/src/components/ess/ManpowerStatus.tsx",type:"file",desc:"Unit manpower gap analysis",detail:"For supervisors/managers. Shows required vs deployed count per unit from manpower_status table. Red/amber/green indicators. Critical for labour contractor compliance."},{id:"unitvisits",name:"UnitVisits.tsx",path:"RCS_ESS/src/components/ess/UnitVisits.tsx",type:"file",desc:"Field visit logs + GPS proof",detail:"Logs client unit visits with timestamp, GPS, notes, photos. Used to prove manpower audits. Endpoint: /unit-visits.php"},{id:"team",name:"TeamSummary.tsx",path:"RCS_ESS/src/components/ess/TeamSummary.tsx",type:"file",desc:"My team - attendance & hierarchy",detail:"Lists subordinates based on role hierarchy. Shows live attendance status. Only visible for supervisor+."},{id:"helpdesk",name:"Helpdesk.tsx",path:"RCS_ESS/src/components/ess/Helpdesk.tsx",type:"file",desc:"Ticketing + support",detail:"Raises tickets to admin. Categories: payroll, attendance, app issue. Comments thread."}]},{id:"admin-comp",name:"admin",path:"RCS_ESS/src/components/admin/",type:"folder",desc:"Admin overrides inside SPA",detail:"Lightweight admin panels embedded in ESS for managers to approve leaves/expenses without going to legacy PHP panel.",children:[{id:"admin-leave",name:"LeaveApprovals.tsx",path:"RCS_ESS/src/components/admin/LeaveApprovals.tsx",type:"file",desc:"Approve/reject leaves",detail:"Queue of pending leaves for reporting hierarchy."},{id:"admin-exp",name:"ExpenseApprovals.tsx",path:"RCS_ESS/src/components/admin/ExpenseApprovals.tsx",type:"file",desc:"Approve expenses",detail:"Bulk approve with amount check."}]}]}]},{id:"public-ess",name:"public",path:"RCS_ESS/public/",type:"folder",desc:"Static assets + PWA manifest",detail:"Contains logo, manifest.json, icons, robots.txt. PWA installable.",children:[{id:"manifest",name:"manifest.json",path:"RCS_ESS/public/manifest.json",type:"file",desc:"PWA manifest",detail:"Name, theme_color amber, icons, display standalone."}]}]},{id:"api",name:"api",path:"api/",type:"folder",desc:"Backend API root - ESS REST",detail:"PHP REST layer serving ESS SPA. Stateless JWT + stateful refresh cookie.",children:[{id:"api-ess",name:"ess",path:"api/ess/",type:"folder",desc:"ESS REST endpoints - 20+ files",detail:"Each PHP file is an endpoint. No framework - vanilla PHP with manual routing via .htaccess. All responses JSON. CORS locked to join.rcsfacility.com.",children:[{id:"config-php",name:"config.php",path:"api/ess/config.php",type:"file",desc:"DB creds + constants + env",detail:"Loads MariaDB credentials for rcsfaxhz_bolt. Defines JWT_SECRET, API_KEY, geofence radius, upload limits. Included in every endpoint. MUST be outside public_html in prod but currently inside.",tags:["critical"]},{id:"cors-php",name:"cors.php",path:"api/ess/cors.php",type:"file",desc:"CORS whitelist",detail:"Allows only https://join.rcsfacility.com, https://rcsfacility.com. Handles preflight OPTIONS. Sets Access-Control-Allow-Credentials true."},{id:"sec-head",name:"security-headers.php",path:"api/ess/security-headers.php",type:"file",desc:"Helmet-like headers",detail:"Sets X-Content-Type-Options, X-Frame-Options DENY, CSP, HSTS. Applied before output."},{id:"helpers",name:"helpers.php",path:"api/ess/helpers.php",type:"file",desc:"jsonResponse(), validate(), sanitize",detail:"Utility functions: jsonSuccess(), jsonError(), sanitizeInput(), generateJWT(), verifyJWT(), checkRateLimit(). Used across endpoints."},{id:"auth-guard",name:"auth-guard.php",path:"api/ess/auth-guard.php",type:"file",desc:"Middleware - verifies JWT + API Key + Role",detail:"Critical middleware. Steps: 1) Check X-API-KEY header vs config, 2) Extract Bearer JWT, 3) verify signature & expiry, 4) Load employee from ess_employee_cache, 5) Attach user to $authUser. Throws 401/403 if fails. Included at top of all protected endpoints.",tags:["auth","critical"]},{id:"login",name:"login.php",path:"api/ess/login.php",type:"file",desc:"POST emp_id + password/PIN -> JWT + HttpOnly cookie",detail:"Auth entrypoint. Validates credentials against employees table (password_hash). On success: issues short-lived JWT (15min) in body, sets refresh_token HttpOnly Secure SameSite=Strict cookie (7 days). Also sets ess_employee_cache for fast lookups. Logs login in audit table."},{id:"refresh",name:"refresh.php",path:"api/ess/refresh.php",type:"file",desc:"Uses HttpOnly cookie to rotate JWT",detail:"Reads refresh_token cookie, validates against DB, issues new JWT. Implements rotation: old refresh invalidated. Prevents XSS theft of long-lived token."},{id:"pin",name:"pin.php",path:"api/ess/pin.php",type:"file",desc:"Set/verify 4-digit PIN for payslip",detail:"Second factor for sensitive data. PIN hashed with bcrypt. Separate from login password."},{id:"att-api",name:"attendance.php",path:"api/ess/attendance.php",type:"file",desc:"Punch + history + geofence check",detail:"POST: validates lat/lng within unit geofence (Haversine), checks duplicate punch, writes to attendance + attendance_summary. GET: returns monthly calendar. Ha
