<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Content Security Policy (Round 5, fixed R11) ──────────────────── -->
    <!-- Single-line: backslash continuations are invalid in HTML attributes. -->
    <!-- style-src 'unsafe-inline' is required because React + shadcn inject  -->
    <!-- inline styles. fonts.googleapis.com is used for the Inter font.       -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" />

    <title>RCS ESS — Employee Self Service</title>
    <meta name="description" content="RCS True Facilities — Employee Self Service Portal" />
    <meta name="author" content="RCS True Facilities Pvt Ltd" />

    <meta property="og:title" content="RCS ESS — Employee Self Service" />
    <meta property="og:description" content="RCS True Facilities — Employee Self Service Portal" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@RCSFacility" />

    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RCS ESS" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // ── Auto-extract mobile/PIN from URL hash for shared login links ──
      // This runs BEFORE React router processes the hash, so the route /ess/xxxx
      // is never seen by the SPA. Instead, the values are stored for LoginScreen.
      (() => {
        const hash = window.location.hash;
        const mobileMatch = hash.match(/^#ess[\/\-](\d{10,14})(?:-(\d{4}))?/);
        if (mobileMatch) {
          const mobile = mobileMatch[1];
          const pin = mobileMatch[2]; // last 4 digits if provided
          // Store for the app to read on startup
          localStorage.setItem('ess_login_mobile', mobile);
          if (pin) {
            localStorage.setItem('ess_login_pin', pin);
          }
          // Clean the hash so React router doesn't try /ess/xxxx as a page route
          window.history.replaceState(null, '', window.location.pathname + window.location.search + '#ess');
        }
      })();
    </script>
  </body>
</html>
