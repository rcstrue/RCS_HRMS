<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Content Security Policy (Round 5) ─────────────────────────────── -->
    <!-- Restricts script/style/image/font/connect sources to prevent XSS,
         data injection, and clickjacking. Adjust connect-src/img-src if
         adding new backend hosts. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; \
                   script-src 'self'; \
                   style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; \
                   img-src 'self' data: blob: https://*.rcsfacility.com; \
                   font-src 'self' data: https://cdn.jsdelivr.net; \
                   connect-src 'self' https://*.rcsfacility.com; \
                   object-src 'none'; \
                   base-uri 'self'; \
                   frame-ancestors 'none'; \
                   form-action 'self';" />

    <title>RCS ESS — Employee Self Service</title>
    <meta name="description" content="RCS True Facilities — Employee Self Service Portal" />
    <meta name="author" content="RCS True Facilities Pvt Ltd" />

    <meta property="og:title" content="RCS ESS — Employee Self Service" />
    <meta property="og:description" content="RCS True Facilities — Employee Self Service Portal" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@RCSFacility" />

    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RCS ESS" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
