name: ESS Lint (TypeScript + ESLint)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'RCS_ESS/**'
      - '.github/workflows/ess-lint.yml'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
 typecheck:
   name: TypeScript
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4

     - uses: oven-sh/setup-bun@v2
       with:
         bun-version: latest

     - name: Install deps
       working-directory: RCS_ESS
       run: bun install --frozen-lockfile

     - name: Type check
       working-directory: RCS_ESS
       run: bunx tsc --noEmit

 eslint:
   name: ESLint
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4

     - uses: oven-sh/setup-bun@v2
       with:
         bun-version: latest

     - name: Install deps
       working-directory: RCS_ESS
       run: bun install --frozen-lockfile

     - name: Lint
       working-directory: RCS_ESS
       run: bunx eslint . --max-warnings=999
