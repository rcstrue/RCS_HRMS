name: ESS Lint (TypeScript + ESLint)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'RCS_ESS/**'
      - '.github/workflows/ess-lint.yml'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: RCS_ESS/package-lock.json

      - name: Install deps
        working-directory: RCS_ESS
        run: npm ci

      - name: Type check
        working-directory: RCS_ESS
        run: npx tsc --noEmit

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: RCS_ESS/package-lock.json

      - name: Install deps
        working-directory: RCS_ESS
        run: npm ci

      - name: Lint
        working-directory: RCS_ESS
        run: npx eslint . --max-warnings=999
