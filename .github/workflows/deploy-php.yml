name: Deploy PHP Admin via FTP

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'hrms/**'
      - 'php_payroll/**'
      - 'database/**'
      - 'api/ess/**'
      - '.github/workflows/deploy-php.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Get changed files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git ls-files -- hrms/ php_payroll/ database/ api/ess/)
            echo "Manual/first push — deploying all HRMS, PHP, database & api/ess files"
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- hrms/ php_payroll/ database/ api/ess/)
            echo "Deploying only changed files"
          fi

          > /tmp/deploy_files.txt
          COUNT=0

          for file in $CHANGED; do
            [ -f "$file" ] || continue

            case "$file" in
              .git*|.github/*|*.md|node_modules/*|logs/*|upload/*|vendor/*)
                continue
                ;;
              api/ess/config.php|api/ess/.htaccess)
                # These are managed manually on the server — never overwrite
                echo "  SKIP (managed manually): $file"
                continue
                ;;
            esac

            echo "$file" >> /tmp/deploy_files.txt
            COUNT=$((COUNT + 1))
          done

          echo "DEPLOY_COUNT=$COUNT" >> $GITHUB_OUTPUT
          echo "Total files to upload: $COUNT"

      - name: Upload via FTP
        if: steps.changed.outputs.DEPLOY_COUNT != '0'
        run: |
          echo "Starting PHP Admin FTP Deploy..."

          SCRIPT="set ftp:ssl-allow no;
          set ftp:passive-mode on;
          set net:timeout 30;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;"

          while IFS= read -r file; do
            # Determine remote path based on file prefix
            case "$file" in
              hrms/*)
                # Strip hrms/ prefix → upload to /hrms/
                RELATIVE="${file#hrms/}"
                REMOTE_DIR="/hrms/$(dirname "$RELATIVE")"
                ;;
              php_payroll/*)
                # Strip php_payroll/ prefix → upload to /hrms/
                RELATIVE="${file#php_payroll/}"
                REMOTE_DIR="/hrms/$(dirname "$RELATIVE")"
                ;;
              database/*)
                # Strip database/ prefix → upload to /hrms/
                RELATIVE="${file#database/}"
                REMOTE_DIR="/hrms/$(dirname "$RELATIVE")"
                ;;
              api/ess/*)
                # api/ess/ files → upload to /api/ess/ (same path under public_html)
                RELATIVE="${file#api/}"
                REMOTE_DIR="/api/$(dirname "$RELATIVE")"
                ;;
              *)
                # Unknown prefix — upload to root
                REMOTE_DIR="/$(dirname "$file")"
                ;;
            esac
            FILE_NAME=$(basename "$RELATIVE")

            echo "  $file → $REMOTE_DIR/$FILE_NAME"

            SCRIPT="$SCRIPT mkdir -p $REMOTE_DIR; put $file -o $REMOTE_DIR/$FILE_NAME;"
          done < /tmp/deploy_files.txt

          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }}" ${{ secrets.FTP_HOST }} -e "$SCRIPT bye"

          echo "PHP Admin FTP Deploy Completed"

      - name: No changes
        if: steps.changed.outputs.DEPLOY_COUNT == '0'
        run: echo "No files changed — skipping deploy"
