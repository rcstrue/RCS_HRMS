name: Deploy PHP Admin via FTP

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'hrms/**'
      - 'api/**'
      - 'database/**'
      - '.github/workflows/deploy-php.yml'
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Upload ALL hrms/ & database/ files (ignore diff)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Get changed files
        id: changed
        env:
          FORCE_FULL: ${{ github.event.inputs.force_full_sync }}
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          # NOTE: The repo's PHP source lives under `hrms/` (renamed from the
          # old `php_payroll/` directory). The previous version of this step
          # only looked for changes under `php_payroll/` and `database/`, which
          # meant EVERY push to `hrms/**` triggered the workflow but uploaded
          # ZERO files. As a result, fixes to e.g. hrms/modules/employee/add.php
          # never reached the live server. We now diff against `hrms/`, `api/`,
          # and `database/` (the directories that actually exist in this repo).
          if [ "$FORCE_FULL" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED=$(git ls-files -- hrms/ api/ database/)
            echo "Full sync — deploying all HRMS, API & database files"
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- hrms/ api/ database/)
            echo "Deploying only changed files"
          fi

          > /tmp/deploy_files.txt
          COUNT=0

          for file in $CHANGED; do
            [ -f "$file" ] || continue

            case "$file" in
              .git*|.github/*|*.md|node_modules/*|logs/*|upload/*|vendor/*)
                continue
                ;;
            esac

            echo "$file" >> /tmp/deploy_files.txt
            COUNT=$((COUNT + 1))
          done

          echo "DEPLOY_COUNT=$COUNT" >> $GITHUB_OUTPUT
          echo "Total files to upload: $COUNT"

      - name: Upload via FTP
        if: steps.changed.outputs.DEPLOY_COUNT != '0'
        run: |
          echo "Starting PHP Admin FTP Deploy..."

          SCRIPT="set ftp:ssl-allow no;
          set ftp:passive-mode on;
          set net:timeout 30;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;"

          while IFS= read -r file; do
            # Strip the source-dir prefix to get the path relative to that dir,
            # then upload under the matching remote dir.
            #   hrms/foo/bar.php      → /hrms/foo/bar.php
            #   api/ess/x.php         → /api/ess/x.php
            #   database/seed.sql     → /database/seed.sql  (historical: mapped
            #                            to /hrms/ by the old workflow; kept as
            #                            /database/ now for correctness)
            case "$file" in
              hrms/*)    RELATIVE="${file#hrms/}";    REMOTE_BASE="/hrms/" ;;
              api/*)     RELATIVE="${file#api/}";     REMOTE_BASE="/api/" ;;
              database/*) RELATIVE="${file#database/}"; REMOTE_BASE="/database/" ;;
              *)         RELATIVE="$file";             REMOTE_BASE="/" ;;
            esac
            REMOTE_DIR="${REMOTE_BASE}$(dirname "$RELATIVE")"
            FILE_NAME=$(basename "$RELATIVE")

            echo "  $file → $REMOTE_DIR/$FILE_NAME"

            SCRIPT="$SCRIPT mkdir -p $REMOTE_DIR; put $file -o $REMOTE_DIR/$FILE_NAME;"
          done < /tmp/deploy_files.txt

          lftp -u "${{ secrets.FTP_USER }},${{ secrets.FTP_PASS }}" ${{ secrets.FTP_HOST }} -e "$SCRIPT bye"

          echo "PHP Admin FTP Deploy Completed"

      - name: No changes
        if: steps.changed.outputs.DEPLOY_COUNT == '0'
        run: echo "No files changed — skipping deploy"
