name: Security Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (RCS_ESS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RCS_ESS

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run npm audit
        run: |
          echo "=== npm audit (production only) ==="
          npm audit --production --json > audit-report.json 2>&1 || true
          npm audit --production || true

          # Fail workflow if HIGH or CRITICAL vulnerabilities found
          HIGH_COUNT=$(node -e "
            const r = require('./audit-report.json');
            const meta = r.metadata || {};
            const vulns = meta.vulnerabilities || {};
            const high = (vulns.high || 0);
            const critical = (vulns.critical || 0);
            console.log(high + critical);
          " 2>/dev/null || echo "0")
          echo "HIGH+CRITICAL count: ${HIGH_COUNT}"
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::warning::Found ${HIGH_COUNT} HIGH/CRITICAL vulnerabilities. Review audit-report.json."
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: RCS_ESS/audit-report.json
          retention-days: 30

  php-security-scan:
    name: PHP security grep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Grep for dangerous patterns
        run: |
          echo "=== Checking for dangerous PHP patterns ==="
          # Scans the application source (hrms/ + api/). It used to scan
          # php_payroll/, which does not exist in this repository, so grep errored
          # out on it and the entire 300+ file HRMS app went unchecked.
          #
          # The checks below FAIL the job. The superglobal heuristic only warns —
          # see the note on it further down.
          FAIL=0
          WARN=0

          # eval() — code injection risk. The (?<!->) / (?<!::) lookbehinds keep
          # method calls out: without them $db->exec() and PDO::exec() matched the
          # exec-family check below (22 false positives).
          MATCHES=$(grep -rnP '(?<!->)(?<!::)\beval\s*\(' hrms/ api/ --include="*.php" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Found eval() usage (code injection risk):"
            echo "$MATCHES"
            FAIL=$((FAIL + 1))
          fi

          # exec() / system() / passthru() / shell_exec() / popen() / proc_open()
          # Filters applied after the match drop three known false positives.
          # Each filter anchors on the `path:line:` prefix that grep -rn emits,
          # so the regex matches the *source* content, not the path/line header.
          #   1. `function exec($sql)` — PHP method DEFINITION (Database::exec()
          #      is a SQL helper, not shell exec). Caught by `function\s+\w+\s*\(`.
          #   2. Lines whose source starts with `<tag` — pure HTML lines where
          #      English phrases like "match system (do not change)" get matched.
          #      Caught by `:[0-9]+:\s*<[a-zA-Z/!]`.
          #   3. Comment lines (`*`, `//`, `#`) — PHPDoc / line comments that
          #      mention "system" or "exec" in prose. Caught by `:[0-9]+:\s*(\*|//|#)`.
          # These filters are slightly lossy (a real shell call inside an HTML
          # line or comment would slip through), but on this codebase the
          # alternative is a permanently-red build, which is worse.
          MATCHES=$(grep -rnP '(?<!->)(?<!::)\b(exec|system|passthru|shell_exec|popen|proc_open)\s*\(' hrms/ api/ --include="*.php" \
                    | grep -vP 'function\s+\w+\s*\(' \
                    | grep -vP ':[0-9]+:\s*(\*|//|#)' \
                    | grep -vP ':[0-9]+:\s*<[a-zA-Z/!]' \
                    || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Found shell execution functions:"
            echo "$MATCHES"
            FAIL=$((FAIL + 1))
          fi

          # var_dump / print_r — debug output
          MATCHES=$(grep -rnP '(?<!->)(?<!::)\b(var_dump|print_r)\s*\(' hrms/ api/ --include="*.php" || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Found debug output functions (remove before production):"
            echo "$MATCHES"
            FAIL=$((FAIL + 1))
          fi

          # Hardcoded passwords / secrets
          MATCHES=$(grep -rniP '(password|secret|api_key)\s*=\s*["\x27][^"\x27]{4,}["\x27]' hrms/ api/ --include="*.php" \
                    | grep -v 'example\.' | grep -v 'config\.local' | grep -v 'placeholder' | grep -iv 'your_' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Possible hardcoded secrets found:"
            echo "$MATCHES"
            FAIL=$((FAIL + 1))
          fi

          # $_GET / $_POST / $_REQUEST without an obvious sanitiser — WARNING ONLY,
          # deliberately. Measured on this codebase this reports 1042 lines, nearly
          # all false positives ((int)$_GET[...] casts, isset() guards, values
          # handed to helpers). Blocking on it would leave the build permanently
          # red, which is worse than no check at all. Tighten the pattern (for
          # example to superglobals interpolated straight into SQL) before making
          # it fail.
          MATCHES=$(grep -rn '\$_\(GET\|POST\|REQUEST\)' hrms/ api/ --include="*.php" \
                    | grep -iv 'sanitize\|htmlspecialchars\|filter_var\|prepare\|bind_param\|intval\|floatval\|strval\|trim' || true)
          if [ -n "$MATCHES" ]; then
            echo "::warning::Superglobals without an obvious sanitiser (heuristic — review manually):"
            echo "$MATCHES" | head -50
            WARN=$((WARN + 1))
          fi

          echo "=== Scan complete. Blocking findings: ${FAIL}, warnings: ${WARN} ==="
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::PHP security scan failed with ${FAIL} blocking finding(s)."
            exit 1
          fi
          echo "No blocking findings."