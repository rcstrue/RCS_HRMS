name: Update README and Sitemap

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://join.rcsfacility.com/
          exclude-paths: 404.shtml RCS_ESS api

      - name: Update README
        run: python hrms/update_readme.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md sitemap.xml hrms/repo-map.html hrms/update_readme.py || true
          git diff --staged --quiet || git commit -m "chore: auto-update README + sitemap"
          git push
