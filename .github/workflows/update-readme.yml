name: Update README and Sitemap

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://join.rcsfacility.com/
          exclude-paths: 404.shtml RCS_ESS api

      - name: Update README
        run: python hrms/update_readme.py

      - name: Commit README + sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md sitemap.xml hrms/ || true
          git diff --staged --quiet || git commit -m "chore: auto-update README map"
          git push || echo "No changes"

      - name: Deploy map to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir:./hrms
          publish_branch: gh-pages
          destination_dir:.
