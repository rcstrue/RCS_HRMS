name: Secret Scan

# Scans the repository for accidentally committed secrets using Gitleaks.
# Runs on every push to main and on every pull request.
# If a secret is found, the workflow fails and the specific file/line is
# reported in the GitHub Actions log.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so we catch secrets in old commits too

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required — the action uses this to report findings.
          # A free tier is sufficient for public repos; for private repos
          # you may need a Gitleaks license key.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: if you have a Gitleaks license, set it here.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Summary
        if: always()
        run: |
          echo "## Secret Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Gitleaks scans for hardcoded secrets including:" >> $GITHUB_STEP_SUMMARY
          echo "- API keys (AWS, Google, Stripe, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- Database connection strings" >> $GITHUB_STEP_SUMMARY
          echo "- Private keys (RSA, SSH, PGP)" >> $GITHUB_STEP_SUMMARY
          echo "- JWT secrets" >> $GITHUB_STEP_SUMMARY
          echo "- Generic passwords/tokens" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If this check fails, **do not** just add the secret to .gitleaksignore." >> $GITHUB_STEP_SUMMARY
          echo "Instead: remove the secret from the code, rotate it, and store it" >> $GITHUB_STEP_SUMMARY
          echo "in the server's .env file or GitHub Actions Secrets." >> $GITHUB_STEP_SUMMARY
