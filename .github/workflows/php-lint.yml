name: PHP Lint (PHPStan + PHPCS)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'hrms/**/*.php'
      - 'api/**/*.php'
      - 'phpstan*.neon*'
      - 'phpcs.xml*'
      - '.github/workflows/php-lint.yml'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan (Level 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpstan

      - name: Run PHPStan
        # NOTE: continue-on-error because this is a large legacy codebase that
        # was never PHPStan-clean. The step reports issues without failing the
        # build — remove continue-on-error once the reported errors are resolved.
        continue-on-error: true
        run: phpstan analyse --no-progress --error-format=table --level=0 api/ hrms/

  phpcs:
    name: PHPCS (PSR-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpcs

      - name: Run PHPCS
        # NOTE: continue-on-error — see PHPStan step note above.
        continue-on-error: true
        run: phpcs --report=full -n --standard=PSR12 --extensions=php api/ hrms/
