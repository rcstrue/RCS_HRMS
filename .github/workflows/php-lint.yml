name: PHP Lint (PHPStan + PHPCS)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'php_payroll/**/*.php'
      - 'api/**/*.php'
      - 'phpstan*.neon*'
      - 'phpcs.xml*'
      - '.github/workflows/php-lint.yml'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan (Level 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpstan

      - name: Run PHPStan
        run: phpstan analyse --no-progress --error-format=table

  phpcs:
    name: PHPCS (PSR-12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: phpcs

      - name: Run PHPCS
        run: phpcs --report=full -n
